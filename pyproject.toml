[project]
name = "zhejiang-tuimian-ddl"
version = "0.1.0"
description = "浙江选调院校硕士预推免官方公告增量采集"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.12,<5",
  "pydantic>=2.10,<3",
  "pypdf>=5,<7",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
