name: Update and deploy

on:
  schedule:
    # UTC 23:23 = 次日北京时间 07:23，避开整点拥堵。
    - cron: '23 23 * * *'
  workflow_dispatch:
    inputs:
      crawl:
        description: '重新检查官方来源（关闭时仅发布已有快照）'
        type: boolean
        default: true
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-data-and-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.9'
          python-version: '3.12'
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - run: uv sync --locked --all-extras
      - run: pnpm install --frozen-lockfile
      - name: Verify collector and UI
        run: |
          uv run pytest tests/python
          pnpm check
          pnpm test
      - name: Install browser for dynamic official sources
        if: github.event_name != 'workflow_dispatch' || inputs.crawl
        run: uv run playwright install --with-deps chromium
      - name: Check official sources
        id: crawl
        continue-on-error: true
        if: github.event_name != 'workflow_dispatch' || inputs.crawl
        run: uv run python -m tuimian crawl --root .
      - name: Validate snapshot
        run: uv run python -m tuimian validate --root . --expect-schools 68
      - name: Write coverage and freshness summary
        if: always()
        run: uv run python scripts/run_summary.py
      - name: Persist crawler state and snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json public/data/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(data): refresh official admission notices'
            git push origin HEAD:master
          fi
      - name: Stop after saving a failed collector run
        if: steps.crawl.outcome == 'failure'
        run: exit 1
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build static site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
